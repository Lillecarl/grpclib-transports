name: CI

on:
  pull_request:
  push:
    branches:
      - develop

jobs:
  docs-build:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: nixbuild/nix-quick-install-action@v35

      - uses: cachix/cachix-action@v15
        with:
          name: lillecarl
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          useDaemon: false

      - name: Build documentation
        run: nix build .#grpclib-transports-docs --out-link result --print-build-logs --print-out-paths

      - name: Verify docs closure
        run: nix store verify --recursive --no-trust "$(readlink -f result)"

      - name: Prepare Pages artifact
        run: |
          mkdir -p public
          cp -r --no-preserve=mode,ownership result/. public/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  docs-deploy:
    if: github.ref == 'refs/heads/develop'
    needs: docs-build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
